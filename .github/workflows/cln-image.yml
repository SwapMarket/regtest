name: CLN image

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'images/c-lightning-plugins/**'
      - '.env'
      - '.github/workflows/cln-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Read versions from .env
        id: versions
        run: |
          for key in CLN_VERSION CLN_SHA256 HOLD_VERSION; do
            value=$(grep -E "^${key}=" .env | cut -d= -f2-)
            if [ -z "$value" ]; then
              echo "$key is missing from .env" >&2
              exit 1
            fi
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/c-lightning-plugins" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: images/c-lightning-plugins
          platforms: linux/amd64
          push: true
          build-args: |
            CLN_VERSION=${{ steps.versions.outputs.CLN_VERSION }}
            CLN_SHA256=${{ steps.versions.outputs.CLN_SHA256 }}
            HOLD_VERSION=${{ steps.versions.outputs.HOLD_VERSION }}
          tags: |
            ${{ steps.versions.outputs.image }}:${{ steps.versions.outputs.CLN_VERSION }}
            ${{ steps.versions.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=Core Lightning ${{ steps.versions.outputs.CLN_VERSION }} with the hold and clnurl plugins
